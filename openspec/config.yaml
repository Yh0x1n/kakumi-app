schema: spec-driven

context: |
  Tech stack: Python 3.10+, Reflex 0.8.28.post1, SQLModel, SQLite, Alembic
  Architecture: Pure Python Reflex (UI + backend), State management via rx.State
  Testing: pytest, ruff linter
  Domain: Karate-Do tournaments (Kata & Kumite) — WKF 2026 rules
  Style: PEP 8, Black 88 chars, type hints required

strict_tdd: true

testing:
  Test Runner: pytest
  Command: python -m pytest tests -v
  Layers:
    Unit: ✅ pytest
    Integration: ✅ httpx
    E2E: ❌ Not installed
  Coverage: ❌ Not configured
  Quality Tools:
    Linter: ✅ ruff (line-length 88)
    Type Checker: ❌ Not configured
    Formatter: ruff (line-length 88)

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbers (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
